
name: 部署文档

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.cache/ai-summaries.json'
  workflow_dispatch:

concurrency:
  group: blog-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # 如果你文档需要 Git 子模块，取消注释下一行
          # submodules: true

      - name: 记录本次构建版本
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"



      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: |
          corepack enable
          npm ci

      - name: 构建文档
        env:
          NODE_OPTIONS: --max_old_space_size=8192
          GENERATE_AI_SUMMARIES: 'true'
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
        run: |-
          npm run docs:build
          > src/.vuepress/dist/.nojekyll

      - name: 保存摘要缓存
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .cache/ai-summaries.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: update AI summary cache'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: 检查是否已有新文章提交
        id: freshness
        shell: bash
        env:
          BUILT_SHA: ${{ steps.source.outputs.sha }}
        run: |
          git fetch origin main
          if git diff --quiet "$BUILT_SHA" origin/main -- . ':!.cache/ai-summaries.json'; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'New source changes detected; the queued run will publish them.'
          fi

      - name: 部署文档
        if: steps.freshness.outputs.deploy == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # 部署文档
          branch: gh-pages
          folder: src/.vuepress/dist
